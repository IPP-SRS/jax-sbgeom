[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sbgeom"
dynamic = ["version"]
description = "A JAX-based package for differentiable stellarator geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Timo Bogaarts"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax",
    "equinox",
    "numpy>=1.20.0",
    "h5py"
]

[project.optional-dependencies]
viz = ["pyvista"]
dagmc = ["pydagmc"]
test = ["pytest", "trimesh", "embreex", "pyvista"]

[project.urls]
Homepage = "https://github.com/IPP-SRS/jax-sbgeom"
Repository = "https://github.com/IPP-SRS/jax-sbgeom"
"Bug Tracker" = "https://github.com/IPP-SRS/jax-sbgeom/issues"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
